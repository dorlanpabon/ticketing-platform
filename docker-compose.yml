name: nequi-ticketing-fresh

x-app: &app
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: ['/tmp:size=128m,mode=1777']
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  mem_limit: 512m
  cpus: 1.0
  depends_on:
    bootstrap: {condition: service_completed_successfully}
    localstack: {condition: service_healthy}
  networks: [ticketing]
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: '3'}

x-aws-environment: &aws-environment
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  AWS_ACCESS_KEY_ID: localemulator
  AWS_SECRET_ACCESS_KEY: localemulator

x-environment: &environment
  <<: *aws-environment
  APP_ENV: local
  APP_ROLE: api
  API_ENABLED: 'true'
  WORKERS_ENABLED: 'false'
  SPRING_PROFILES_ACTIVE: local
  AUTH_MODE: local
  DYNAMODB_ENDPOINT: http://dynamodb:8000
  SQS_ENDPOINT: &sqs-endpoint http://localstack:4566
  INVENTORY_COMMANDS_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/inventory-commands
  ORDER_EVENTS_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/order-events
  CATALOG_EVENTS_QUEUE_URL: http://localstack:4566/queue/us-east-1/000000000000/catalog-events
  INVENTORY_BASE_URL: http://inventory:8080
  CATALOG_BASE_URL: http://catalog:8080

x-worker-environment: &worker-environment
  <<: *environment
  APP_ROLE: worker
  API_ENABLED: 'false'
  WORKERS_ENABLED: 'true'

services:
  dynamodb:
    image: amazon/dynamodb-local:3.1.0@sha256:7ef4a2c45b58c2901e70a4f28e0953a422c2c631baaaf5e2c15e0805740c7752
    command: [-jar, DynamoDBLocal.jar, -sharedDb, -dbPath, /home/dynamodblocal/data]
    user: '0:0'
    ports: ['127.0.0.1:18000:8000']
    volumes: [dynamodb-data:/home/dynamodblocal/data]
    networks: [ticketing]
    mem_limit: 512m
    restart: unless-stopped

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    ports: ['127.0.0.1:4566:4566']
    environment:
      <<: *aws-environment
      SERVICES: sqs
      LOCALSTACK_HOST: localstack:4566
      SQS_ENDPOINT_STRATEGY: path
      SQS_DISABLE_CLOUDWATCH_METRICS: '1'
    volumes:
      - ./scripts/local/init-sqs.py:/etc/localstack/init/ready.d/init-sqs.py:ro
    networks: [ticketing]
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, sys, urllib.request;
          ready = json.load(urllib.request.urlopen('http://127.0.0.1:4566/_localstack/init/ready', timeout=2));
          sys.exit(not (ready['completed'] and any(script['name'] == 'init-sqs.py' and script['state'] == 'SUCCESSFUL' for script in ready['scripts'])))
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 18

  bootstrap:
    image: &aws-cli-image amazon/aws-cli:2.31.22@sha256:bf253be91e12d49ba1bd6dc939a76ea9777901772032692b14639e643118e1c1
    entrypoint: [/bin/sh, /bootstrap/bootstrap.sh]
    environment: *environment
    volumes: ['./scripts/local:/bootstrap:ro']
    depends_on: [dynamodb]
    networks: [ticketing]
    restart: 'no'

  expiry-recovery:
    image: *aws-cli-image
    init: true
    entrypoint: [/bin/sh, /bootstrap/recovery-tick.sh]
    environment:
      <<: *aws-environment
      AWS_PAGER: ''
      AWS_MAX_ATTEMPTS: '2'
      SQS_ENDPOINT: *sqs-endpoint
      INVENTORY_EXPIRATIONS_QUEUE_URL: &expiration-queue http://localstack:4566/queue/us-east-1/000000000000/inventory-expirations
    volumes: ['./scripts/local:/bootstrap:ro']
    depends_on:
      localstack: {condition: service_healthy}
    read_only: true
    tmpfs: ['/tmp:size=16m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    networks: [ticketing]
    restart: unless-stopped
    healthcheck:
      test: [CMD, /bin/sh, /bootstrap/recovery-tick.sh, health]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  catalog:
    <<: *app
    build: {context: ., args: {SERVICE: catalog}}
    image: ticketing-catalog:local
    ports: ['127.0.0.1:18080:8080']
    environment:
      <<: *environment
      DYNAMODB_TABLE_NAME: ticketing-local-catalog

  orders:
    <<: *app
    build: {context: ., args: {SERVICE: orders}}
    image: ticketing-orders:local
    ports: ['127.0.0.1:18081:8080']
    environment:
      <<: *environment
      DYNAMODB_TABLE_NAME: ticketing-local-orders

  inventory:
    <<: *app
    build: {context: ., args: {SERVICE: inventory}}
    image: ticketing-inventory:local
    ports: ['127.0.0.1:18082:8080']
    environment:
      <<: *environment
      DYNAMODB_TABLE_NAME: ticketing-local-inventory
      INVENTORY_EXPIRATIONS_QUEUE_URL: *expiration-queue
      LOCAL_RECOVERY_ENABLED: 'false'

  catalog-worker:
    <<: *app
    build: {context: ., args: {SERVICE: catalog}}
    image: ticketing-catalog:local
    environment:
      <<: *worker-environment
      DYNAMODB_TABLE_NAME: ticketing-local-catalog

  orders-worker:
    <<: *app
    build: {context: ., args: {SERVICE: orders}}
    image: ticketing-orders:local
    environment:
      <<: *worker-environment
      DYNAMODB_TABLE_NAME: ticketing-local-orders

  inventory-worker:
    <<: *app
    build: {context: ., args: {SERVICE: inventory}}
    image: ticketing-inventory:local
    environment:
      <<: *worker-environment
      DYNAMODB_TABLE_NAME: ticketing-local-inventory
      INVENTORY_EXPIRATIONS_QUEUE_URL: *expiration-queue
      LOCAL_RECOVERY_ENABLED: 'false'

  sonar-db:
    image: postgres:17-alpine@sha256:a77aa70e641402a21411b92b721c58d10f23b50ae5fdd2333efd22d166e1e5f7
    profiles: [quality]
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-}
    volumes: [sonar-db:/var/lib/postgresql/data]
    networks: [quality]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U sonar -d sonar']
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 256m

  sonar:
    image: sonarqube:26.11.0.134175-community@sha256:65541accbdb92e27fe770fc6ba99988a3dd5a0c71ffafd67f88abfad366996fa
    profiles: [quality]
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-}
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    ports: ['127.0.0.1:19000:9000']
    volumes: [sonar-data:/opt/sonarqube/data, sonar-extensions:/opt/sonarqube/extensions, sonar-logs:/opt/sonarqube/logs]
    depends_on:
      sonar-db: {condition: service_healthy}
    networks: [quality]
    mem_limit: 3g
    ulimits:
      nofile: {soft: 65536, hard: 65536}

networks:
  ticketing: {}
  quality: {}
volumes:
  dynamodb-data: {}
  sonar-db: {}
  sonar-data: {}
  sonar-extensions: {}
  sonar-logs: {}
