logging:
  structured:
    format:
      console: ecs
server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: catalog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:aws}
  codec:
    max-in-memory-size: 16KB
management:
  otlp:
    metrics:
      export:
        enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
      role: ${APP_ROLE:api}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    export:
      enabled: ${TRACING_ENABLED:false}
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://otel-collector:4318/v1/traces}
          timeout: 2s
          connect-timeout: 1s
  logging:
    export:
      otlp:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
cors:
  allowed-origins: ""
aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
catalog:
  limits:
    max-name-length: 120
    max-venue-length: 200
    min-capacity: 1
    max-capacity: 100000
    min-page-size: 1
    max-page-size: 100
    default-page-size: 50
entrypoint:
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:#{null}}
    queueUrl: ${CATALOG_EVENTS_QUEUE_URL}
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 60
    numberOfThreads: 1
adapter:
  sqs:
    region: ${AWS_REGION:us-east-1}
    queueUrl: ${INVENTORY_COMMANDS_QUEUE_URL}
    endpoint: ${SQS_ENDPOINT:#{null}}
