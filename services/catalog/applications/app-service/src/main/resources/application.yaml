logging:
  structured:
    format:
      console: ecs
server:
  port: ${PORT:8080}
  shutdown: graceful
spring:
  application:
    name: catalog
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:aws}
  codec:
    max-in-memory-size: 16KB
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
cors:
  allowed-origins: ""
aws:
  region: ${AWS_REGION:us-east-1}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
entrypoint:
  sqs:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SQS_ENDPOINT:#{null}}
    queueUrl: ${CATALOG_EVENTS_QUEUE_URL}
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 60
    numberOfThreads: 1
adapter:
  sqs:
    region: ${AWS_REGION:us-east-1}
    queueUrl: ${INVENTORY_COMMANDS_QUEUE_URL}
    endpoint: ${SQS_ENDPOINT:#{null}}
