name: Candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: candidate-develop
  cancel-in-progress: false

jobs:
  candidate:
    name: Build immutable DEV candidate
    if: github.ref == 'refs/heads/develop'
    environment: candidate-develop
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Set up Java 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '25'
      - name: Install pinned image scanner
        run: python scripts/quality/install_tools.py --destination "$RUNNER_TEMP/quality-tools" --only trivy --github-path
      - name: Verify evidence, acceptance, images and SBOM
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_FROZEN: ${{ vars.RELEASE_FROZEN }}
          INFRA_SHA: ${{ vars.APPROVED_INFRA_SHA }}
        run: python scripts/quality/candidate.py --infra-sha "$INFRA_SHA"
      - name: Publish immutable candidate manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ github.sha }}
          path: build/quality/candidate
          if-no-files-found: error
          retention-days: 30
