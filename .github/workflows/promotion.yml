name: Promotion

on:
  pull_request_target:
    branches: [release, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  actions: read

concurrency:
  group: promotion-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify:
    name: Exact candidate promotion
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout trusted promotion policy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Checkout candidate as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - name: Verify trusted workflow evidence and unchanged images
        env:
          GH_TOKEN: ${{ github.token }}
        run: python trusted/scripts/quality/promote.py candidate
