include classpath("application.conf")
node-address { protocol = http, host = elasticmq, port = 9324, context-path = "" }
rest-sqs { enabled = true, bind-port = 9324, bind-hostname = "0.0.0.0" }
rest-stats { enabled = false }
messages-storage { enabled = true }
file-storage { enabled = true, path = "/data/queues.conf" }
queues {
  inventory-commands-dlq { defaultVisibilityTimeout = 60 seconds, messageRetentionPeriod = 14 days }
  inventory-expirations-dlq { defaultVisibilityTimeout = 60 seconds, messageRetentionPeriod = 14 days }
  order-events-dlq { defaultVisibilityTimeout = 60 seconds, messageRetentionPeriod = 14 days }
  catalog-events-dlq { defaultVisibilityTimeout = 60 seconds, messageRetentionPeriod = 14 days }
  inventory-commands {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue { name = inventory-commands-dlq, maxReceiveCount = 5 }
  }
  inventory-expirations {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue { name = inventory-expirations-dlq, maxReceiveCount = 5 }
  }
  order-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue { name = order-events-dlq, maxReceiveCount = 5 }
  }
  catalog-events {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    messageRetentionPeriod = 4 days
    deadLettersQueue { name = catalog-events-dlq, maxReceiveCount = 5 }
  }
}
